services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: ":8080"
      APP_ENVIRONMENT: "docker"
      APP_API_KEYS: "change-me-local-dev-key"
      APP_STORE_PATH: "/app/data/store.json"
      APP_MEDIA_ROOT: "/app/data/media"
      APP_ENABLE_RISKY_EXTRACTORS: "false"
      APP_YT_DLP_BINARY: "yt-dlp"
    volumes:
      - ./data:/app/data
